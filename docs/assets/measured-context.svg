<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Measured task-scoped context size by budget</title>
  <desc id="desc">In a measured 1000-task synthetic workload, context outputs at byte budgets 512, 1024, 2048, and 4096 used 118, 204, 420, and 852 cl100k_base tokens, with 25, 22, 16, and 4 optional items omitted.</desc>
  <rect width="1120" height="500" rx="24" fill="#0b1220"/>
  <text x="42" y="54" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">Measured context, not a theoretical token claim</text>
  <text x="42" y="83" fill="#a8b5c9" font-family="system-ui,sans-serif" font-size="15">1,000-task synthetic workload · selected anchor task · tiktoken 0.12.0 / cl100k_base</text>
  <text x="43" y="127" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">UTF-8 byte ceiling</text>
  <text x="235" y="127" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Actual measured tokens</text>
  <text x="914" y="127" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="14">Optional items omitted</text>
  <line x1="42" y1="142" x2="1078" y2="142" stroke="#334155"/>
  <text x="43" y="192" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">512</text>
  <rect x="235" y="170" width="78" height="28" rx="8" fill="#4adeaf"/>
  <text x="326" y="192" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="18">118</text>
  <text x="920" y="192" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18">25</text>
  <text x="43" y="257" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">1,024</text>
  <rect x="235" y="235" width="135" height="28" rx="8" fill="#4adeaf"/>
  <text x="383" y="257" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="18">204</text>
  <text x="920" y="257" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18">22</text>
  <text x="43" y="322" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">2,048</text>
  <rect x="235" y="300" width="278" height="28" rx="8" fill="#4adeaf"/>
  <text x="526" y="322" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="18">420</text>
  <text x="920" y="322" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18">16</text>
  <text x="43" y="387" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">4,096</text>
  <rect x="235" y="365" width="563" height="28" rx="8" fill="#4adeaf"/>
  <text x="811" y="387" fill="#d1fae5" font-family="system-ui,sans-serif" font-size="18">852</text>
  <text x="920" y="387" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="18">4</text>
  <line x1="42" y1="420" x2="1078" y2="420" stroke="#334155"/>
  <text x="42" y="450" fill="#a8b5c9" font-family="system-ui,sans-serif" font-size="14">Every tested output retained the goal and next action. Product enforcement is by bytes, not this tokenizer.</text>
  <text x="42" y="474" fill="#a8b5c9" font-family="system-ui,sans-serif" font-size="13">Source: benchmarks/results/task-ledger-2026-09-25.json · Bars proportional to measured token counts.</text>
</svg>
