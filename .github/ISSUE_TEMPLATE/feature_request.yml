name: Feature request
description: Suggest a ContextSpindle task-continuity improvement
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement to durable task continuity, context assembly, or the bounded retrieval cache.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or friction is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What should ContextSpindle do, and how would an agent use it?
    validations:
      required: true
