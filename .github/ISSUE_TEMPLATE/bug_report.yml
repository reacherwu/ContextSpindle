name: Bug report
description: Report a ContextSpindle task-continuity or memory issue
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a ContextSpindle bug. Remove private task text and secrets before sharing logs or ledger files.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen instead.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this in a fresh workspace? Include the CLI or MCP calls and whether the task ledger or retrieval cache was involved.
      placeholder: |
        1. Run `contextspindle init .` in a temporary workspace.
        2. Run `contextspindle task create ...` and the affected operation.
        3. Record the expected and actual task state, without secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ContextSpindle version
      description: Output of `contextspindle version` and the operating system
      placeholder: contextspindle 0.3.0 on macOS
    validations:
      required: true
